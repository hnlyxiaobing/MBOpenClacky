<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBOpenClacky - AI Agent</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/github-dark.min.css">
  <link rel="stylesheet" href="js/lib/katex/katex.min.css">
  <script src="js/lib/marked.min.js"></script>
  <script src="js/lib/highlight.min.js"></script>
  <script defer src="js/lib/katex/katex.min.js"></script>
  <script defer src="js/lib/qrcode/qrcode.min.js"></script>
  <script type="module" src="mb/public/editor.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="notifications-container" class="notifications"></div>
  <script>
    window.mbCopyCode = function(btn) {
      var codeBlock = btn.closest('.code-block-header')?.nextElementSibling?.querySelector('code');
      if (codeBlock) {
        navigator.clipboard.writeText(codeBlock.textContent).then(function() {
          btn.textContent = 'Copied!'; btn.classList.add('copied');
          setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
        });
      }
    };
  </script>
  <script type="module" src="mb/index.js"></script>
</body>
</html>
