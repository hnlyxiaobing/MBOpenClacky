<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{BRAND_NAME}} - AI Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234f8ef7'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='18' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <noscript>
    <div style="padding:2rem;text-align:center;font-family:sans-serif">
      {{BRAND_NAME}} requires JavaScript. Please enable JavaScript and reload.
    </div>
  </noscript>
  <div id="app">
    <!-- Top Header Bar -->
    <header id="top-header">
      <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar">☰</button>
      <img class="logo" src="favicon.svg" alt="{{BRAND_NAME}}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
      <span class="logo-fallback" style="display:none;font-weight:bold">{{BRAND_NAME}}</span>
      <div class="header-spacer"></div>
      <input id="search-input" type="search" placeholder="Search..." aria-label="Search">
      <button id="share-btn" class="icon-btn" aria-label="Share">⤴</button>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">🌓</button>
    </header>

    <!-- Sidebar -->
    <aside id="sidebar">
      <button id="new-session-btn" class="sidebar-action">+ New Session</button>
      <ul id="session-list" class="session-list">
        <li class="session-item empty-msg">No sessions yet</li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main id="main-content">
      <div id="chat-container">
        <div class="welcome-screen">
          <h1>{{BRAND_NAME}}</h1>
          <p>AI Agent CLI — Web Interface</p>
          <div class="input-bar">
            <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
            <button id="send-btn" class="primary-btn">Send</button>
          </div>
        </div>
      </div>
    </main>

    <div id="notifications-container" class="notifications"></div>
  </div>
  <script src="app.js"></script>
  {{EXT_SCRIPTS}}
</body>
</html>
