name: debug-apt

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Dump apt sources layout
        run: |
          ls -la /etc/apt/ /etc/apt/sources.list.d/
          echo "=== /etc/apt/sources.list ==="
          cat /etc/apt/sources.list 2>/dev/null || echo "(none)"
          echo "=== sources.list.d/* ==="
          for f in /etc/apt/sources.list.d/*; do
            echo "--- $f ---"
            cat "$f"
          done
          echo "=== grep azure ==="
          grep -rn "azure.archive" /etc/apt/ 2>/dev/null || echo "(no azure refs in /etc/apt)"
