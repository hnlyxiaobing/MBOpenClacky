name: Docker

on:
  push:
    branches: [main]

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mbopenclacky
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Compute toolchain cache-buster date
        id: toolchain_buster
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Refresh the toolchain-install layer at most once per day (see
          # TOOLCHAIN_CACHE_BUSTER in Dockerfile): keeps the cached toolchain
          # from going stale while still allowing same-day layer reuse.
          build-args: |
            TOOLCHAIN_CACHE_BUSTER=${{ steps.toolchain_buster.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker images mbopenclacky
          docker run --rm mbopenclacky:latest --version || echo "Image built successfully (entrypoint check)"
