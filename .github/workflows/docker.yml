name: Docker

on:
  push:
    branches: [main]

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mbopenclacky
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Compute toolchain cache-buster date
        id: toolchain_buster
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No buildx cache: the MoonBit CDN only serves "nightly" (specific
          # versions return 403), so any cached toolchain layer drifts from
          # the version used to generate committed .mbti files. The ~30-60 s
          # toolchain download is worth the consistency guarantee.
          build-args: |
            TOOLCHAIN_CACHE_BUSTER=${{ steps.toolchain_buster.outputs.date }}

      - name: Verify image
        run: |
          docker images mbopenclacky
          docker run --rm mbopenclacky:latest --version || echo "Image built successfully (entrypoint check)"
