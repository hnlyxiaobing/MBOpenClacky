name: Docker

on:
  push:
    branches: [main]

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mbopenclacky
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Compute toolchain cache-buster date
        id: toolchain_buster
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No buildx cache: the installer uses the moving `latest` stable alias;
          # specific builds may be retired, so a cached toolchain layer can drift from
          # the version used to generate committed .mbti files. The ~30-60 s
          # toolchain download is worth the consistency guarantee. The daily buster keeps the stable alias fresh.
          build-args: |
            TOOLCHAIN_CACHE_BUSTER=${{ steps.toolchain_buster.outputs.date }}

      - name: Verify image
        run: |
          set -euo pipefail
          docker images mbopenclacky
          # The image entrypoint is `./mbopenclacky server`, so `--version` must
          # override it — appending it would start a web server instead of
          # printing a version. This step used to end in `|| echo`, which made
          # the verify a no-op gate that could never go red.
          OUT=$(docker run --rm --entrypoint ./mbopenclacky mbopenclacky:latest --version)
          echo "image reports: $OUT"
          EXPECTED="MBOpenClacky v$(sed -n 's/^const VERSION : String = "\(.*\)"/\1/p' cmd/main.mbt)"
          [ "$OUT" = "$EXPECTED" ] || {
            echo "::error::image version "$OUT" != repo version "$EXPECTED""
            exit 1
          }
