name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Check · Build · Test
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            libssl-dev \
            libcurl4-openssl-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cache MoonBit toolchain
        id: cache-moon
        uses: actions/cache@v6
        with:
          path: ~/.moon
          key: moon-toolchain-${{ runner.os }}-v1

      - name: Install MoonBit toolchain
        if: steps.cache-moon.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit installation
        run: moon version

      - name: Cache project dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: mooncakes-deps-${{ runner.os }}-${{ hashFiles('moon.mod') }}

      - name: Install project dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          # Retry moon dependency fetch up to 3 times to handle transient
          # registry failures (mooncakes.io availability).
          for attempt in 1 2 3; do
            echo "Attempt $attempt: fetching dependencies..."
            if moon build --target native cmd 2>&1; then
              echo "Dependencies fetched successfully."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Failed to fetch dependencies after 3 attempts."
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

      - name: Type check
        run: moon check --frozen

      - name: Warning budget gate (P2-3)
        # Reports the MoonBit warning count against the P2-3 budget. Runs in
        # report-only mode so CI is not broken by pre-existing warnings; flip
        # to strict once the count is driven down to the <=200 target.
        run: bash scripts/warn_count.sh 200

      - name: Guard insecure crypto build
        # Refuse to ship the weak crypto stubs (lib/brand/brand_stubs.c) in a
        # release artifact. This complements the compile-time #error guard in
        # brand_stubs.c with a CI-level safety net.
        run: bash scripts/check-crypto-build.sh release

      - name: Build (native release)
        run: moon build --target native --release --frozen cmd

      - name: Run tests
        run: moon test --frozen
