name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Fast gate: type errors and policy violations fail here in ~1 min,
  #    before the expensive build/test runners spin up.
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Install build dependencies explicitly. The runner image does not ship
      # all of these, and we need them for compiling C stubs (libssl-dev for
      # crypto, nodejs for the prebuild script).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            make \
            libssl-dev \
            nodejs

      # Install the latest stable MoonBit toolchain. The CDN's `latest` alias
      # resolves to the current stable release; do not pin a retired build.
      - name: Install MoonBit toolchain (latest stable)
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit installation
        id: toolchain
        run: |
          moon version
          echo "id=$(moon version | head -1 | tr -d ' ()')" >> "$GITHUB_OUTPUT"

      - name: Cache mooncakes dependencies
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: mooncakes-${{ runner.os }}-v4-${{ hashFiles('moon.mod') }}
          restore-keys: |
            mooncakes-${{ runner.os }}-v4-

      - name: Update registry index and resolve dependencies
        run: |
          # `moon update` resolves and downloads all dependencies. Bare
          # `moon install` is deprecated (warns and exits 0) and adds nothing.
          moon update

      - name: Migrate legacy moon.mod.json dependencies
        run: bash scripts/migrate_moon_mod_json.sh

      - name: Type check
        run: |
          # Capture full output for debugging
          set +e
          moon check -j "$(nproc)" 2>&1 | tee /tmp/moon_check.log
          # ${PIPESTATUS[0]} is the compiler's status; `$?` would be tee's
          # (always 0 unless the runner happens to enable pipefail).
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::moon check failed with exit code $EXIT_CODE"
            echo "=== Full moon check output ==="
            cat /tmp/moon_check.log
            exit $EXIT_CODE
          fi

      - name: Warning budget gate (P2-3)
        # Reuses the log the type-check step captured rather than re-running a
        # second full `moon check`.
        run: bash scripts/warn_count.sh --log /tmp/moon_check.log

      - name: Public API gate (P0-1, .mbti diff)
        continue-on-error: true
        run: |
          echo "Toolchain version:"
          moon version
          echo ""
          echo "Running moon info..."
          moon info
          echo ""
          echo "Checking for .mbti changes..."
          if ! git diff --exit-code -- '**/pkg.generated.mbti'; then
            echo "::warning::public API changed without committing .mbti files." \
                 "Run 'moon info' locally and commit the updated pkg.generated.mbti." >&2
            echo ""
            echo "=== Changed files ==="
            git diff --name-only -- '**/pkg.generated.mbti' >&2 || true
            echo ""
            echo "=== Diff stats ==="
            git diff --stat -- '**/pkg.generated.mbti' >&2 || true
            echo ""
            echo "=== First 100 lines of diff ==="
            git diff -- '**/pkg.generated.mbti' | head -100 >&2 || true
          else
            echo "No .mbti changes detected - gate passed"
          fi

      - name: Known-gaps ledger gate (P0-2)
        run: bash scripts/known_gaps.sh check

  # ── Build the release binary and run the full test suite.
  #    Both steps compile the same library code but into separate artifact trees
  #    (build/ vs test/). Caching _build/native/release covers both trees in a
  #    single cache entry: on a cache hit, moon skips recompilation entirely for
  #    unchanged packages.
  #
  #    Tests run in debug mode (no --release) because the scoped module tests
  #    compile 2-3x faster. Use release mode only for release-specific behavior.
  build-and-test:
    name: Build · Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v7

      # Install build dependencies explicitly for compiling C stubs and running prebuild scripts.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            make \
            libssl-dev \
            nodejs

      # Install the latest stable MoonBit toolchain. The CDN's `latest` alias
      # resolves to the current stable release; do not pin a retired build.
      - name: Install MoonBit toolchain (latest stable)
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit installation
        id: toolchain
        run: |
          moon version
          echo "id=$(moon version | head -1 | tr -d ' ()')" >> "$GITHUB_OUTPUT"

      - name: Cache mooncakes dependencies
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: mooncakes-${{ runner.os }}-v4-${{ hashFiles('moon.mod') }}
          restore-keys: |
            mooncakes-${{ runner.os }}-v4-

      - name: Update registry index and resolve dependencies
        run: |
          # `moon update` resolves and downloads all dependencies. Bare
          # `moon install` is deprecated (warns and exits 0) and adds nothing.
          moon update

      - name: Migrate legacy moon.mod.json dependencies
        run: bash scripts/migrate_moon_mod_json.sh

      # Cache the entire native release tree. Both `moon build` (→ build/) and
      # `moon test --release` (→ test/) write here. A single cache entry covers
      # both, so on a cache hit neither step recompiles unchanged packages.
      #
      # Measured baseline (uncached, release mode): build 4.7 min, test 13.3 min.
      # With cache hit + debug mode: build ~1 min, test ~1-2 min.
      - name: Cache compiled artifacts
        uses: actions/cache@v6
        with:
          path: _build/native/release
          key: moonbuild-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('moon.mod', 'moon.mod.json', 'scripts/build-script.js', '**/*.mbt', '**/*.mbti', '**/moon.pkg') }}
          restore-keys: |
            moonbuild-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      # Guards the release artifact. It lives here, not in the `checks` job,
      # because that job compiles nothing — an env-var check there could never
      # actually protect a build.
      - name: Guard insecure crypto build
        run: bash scripts/check-crypto-build.sh release

      - name: Build (native release)
        run: |
          set +e
          moon version
          moon build --target native --release cmd -j "$(nproc)" 2>&1 | tee /tmp/moon_build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::moon build failed with exit code $EXIT_CODE"
            echo "=== Full build output ==="
            cat /tmp/moon_build.log
            exit $EXIT_CODE
          fi

      - name: Run tests (module packages)
        # Scoped to lib/cmd/test minus lib/mcp. Debug mode compiles 2-3x faster;
        # release-specific behavior is validated separately.
        # The log is tee'd (not redirected) and the exit code captured: under
        # `bash -e` a plain redirect aborted the step before `cat`, so a failing
        # run published a truncated artifact and showed nothing but
        # "Process completed with exit code N" in the UI.
        run: |
          set +e
          pkgs=$(find lib cmd test -name moon.pkg | sed 's|/moon.pkg$||' \
            | grep -v '^lib/mcp$' | grep -v '^test/e2e$' | tr '\n' ' ')
          # `moon_test_main.log` is the caliber that repo_stats records: this step
          # alone. The lib/mcp step appends to moon_test.log (so one artifact
          # carries every failing test for the annotation step), and repo_stats.sh
          # sums every "Total tests:" line it is handed — pointing it at the mixed
          # log reported 4086 + 96 = 4182 and failed the gate.
          moon test $pkgs -j "$(nproc)" 2>&1 | tee "$RUNNER_TEMP/moon_test.log" \
            "$RUNNER_TEMP/moon_test_main.log"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::moon test failed with exit code $EXIT_CODE"
          fi
          exit $EXIT_CODE

      - name: Run lib/mcp tests
        # Appends to the combined log only; the recorded main-step count comes
        # from moon_test_main.log, which this step must not touch.
        run: |
          set +e
          moon test lib/mcp -j "$(nproc)" 2>&1 | tee -a "$RUNNER_TEMP/moon_test.log"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          [ $EXIT_CODE -eq 0 ] || echo "::error::lib/mcp moon test failed with exit code $EXIT_CODE"
          exit $EXIT_CODE

      # Job logs and log artifacts need GitHub authentication even for a public
      # repo, but check-run annotations are public
      # (`GET /repos/{owner}/{repo}/check-runs/{job_id}/annotations`). Publishing
      # the failing test lines as annotations is what makes a red CI diagnosable
      # from the outside; without it a red run only says "exit code N".
      - name: Publish failing tests as annotations
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/moon_test.log"
          if [ ! -s "$LOG" ]; then
            echo "::error::no moon test output was captured"
            exit 0
          fi
          # moon prints every failing test as one line shaped like
          #   [<module>] test <file>:<line> ("<name>") failed: <file>:<loc> FAILED: 10 != 11
          # so the marker is `) failed: ` — the leading `[module]` bracket is what
          # makes the line matchable, and stripping it keeps the annotation single-line.
          grep -E -- '\) failed: ' "$LOG" | head -20 |
            sed 's/^\[[^]]*\] //; s/%/%25/g; s/\r//g' |
            while IFS= read -r l; do echo "::error::$l"; done
          grep -oE -- 'Total tests: [0-9]+, passed: [0-9]+, failed: [1-9][0-9]*' "$LOG" |
            while IFS= read -r l; do echo "::error::$l"; done
          # Digest for the cases the greps above cannot see (an aborted or
          # panicked test binary prints no `) failed:` line at all).
          MSG=$(tail -25 "$LOG" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/%0A$//')
          echo "::error::tail: $MSG"
          exit 0

      - name: Benchmark gate (Phase 1, optional)
        continue-on-error: true
        run: |
          BIN=$(bash scripts/release_binary.sh)
          "$BIN" benchmark --threshold 15.0 --check-baseline

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moon-test-log
          path: |
            ${{ runner.temp }}/moon_test.log
            ${{ runner.temp }}/moon_test_main.log
          retention-days: 1

      - name: CLI contract probes (P0-3)
        run: |
          BIN=$(bash scripts/release_binary.sh)
          "$BIN" selftest --repo .

      - name: Deterministic capability eval (P2 / T8)
        run: |
          BIN=$(bash scripts/release_binary.sh)
          "$BIN" eval --offline --repo . | tee "$RUNNER_TEMP/eval.json"
          grep -q '"completion_rate":1' "$RUNNER_TEMP/eval.json"
          grep -q '"repeatability":1' "$RUNNER_TEMP/eval.json"

  # ── Layer 4/8 link-level scenarios run in their own job.
  #    test/e2e drives the real retry/backoff path against a mock LLM socket,
  #    and MockLlmServer::serve reads with a blocking conn.read_until: when a
  #    scenario parks the single-threaded native runtime, @async timers cannot
  #    run and with_timeout_opt never fires, so the binary never exits. That was
  #    observed on Linux for the first time on run 38835281930 (test step stuck
  #    at 1404 s, no "Total tests:" line at all, job cancelled by its own
  #    30-minute timeout while the normal cost of this step is ~110 s).
  #    Isolating the package means a dead-wait costs one job with a tight budget
  #    instead of the whole suite, and the job-level conclusion names the culprit.
  e2e-tests:
    name: Scenarios (test/e2e)
    runs-on: ubuntu-24.04
    # 15 min = cold debug compile of this package's dependency closure (~5 min
    # observed for the shared suite) + the scenarios themselves, where `013` alone
    # can cost 10 backoff sleeps inflated ~4.5x by load (300s budget already
    # granted in scenarios_wbtest.mbt). Tight enough that a dead wait is a named,
    # fast red; loose enough that load inflation cannot cancel a passing run.
    timeout-minutes: 15
    needs: checks
    steps:
      - uses: actions/checkout@v7

      # Setup mirrors `Build · Test` step for step (dependency list, toolchain
      # installer URL, PATH, mooncakes cache key) so this job restores the same
      # caches that job already warms and adds no new failure modes.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            make \
            libssl-dev \
            nodejs

      - name: Install MoonBit toolchain (latest stable)
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit installation
        run: moon version

      - name: Cache mooncakes dependencies
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: mooncakes-${{ runner.os }}-v4-${{ hashFiles('moon.mod') }}
          restore-keys: |
            mooncakes-${{ runner.os }}-v4-

      - name: Update registry index and resolve dependencies
        run: moon update

      - name: Migrate legacy moon.mod.json dependencies
        run: bash scripts/migrate_moon_mod_json.sh

      # Full build parallelism is safe here and -j 1 would only slow the compile:
      # this job runs a single package, so its test binary is the only process on
      # the runner. That is also what protects the 5 s backoff sleeps this package
      # depends on — they were inflated to 22.7 s / 26.0 s when 29 package binaries
      # competed for the same cores in the shared test step.
      - name: Run scenario tests (test/e2e)
        run: |
          set +e
          moon test test/e2e -j "$(nproc)" 2>&1 | tee "$RUNNER_TEMP/moon_test_e2e.log"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::test/e2e moon test failed with exit code $EXIT_CODE"
          fi
          exit $EXIT_CODE

      - name: Publish failing scenario tests as annotations
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/moon_test_e2e.log"
          if [ ! -s "$LOG" ]; then
            echo "::error::no test/e2e output was captured"
            exit 0
          fi
          grep -E -- '\) failed: ' "$LOG" | head -20 |
            sed 's/^\[[^]]*\] //; s/%/%25/g; s/\r//g' |
            while IFS= read -r l; do echo "::error::$l"; done
          grep -oE -- 'Total tests: [0-9]+, passed: [0-9]+, failed: [1-9][0-9]*' "$LOG" |
            while IFS= read -r l; do echo "::error::$l"; done
          # A cancelled binary prints no failure line; the last stderr from the
          # mock server ([stream-summary]) is what identifies the stuck scenario.
          MSG=$(tail -15 "$LOG" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/%0A$//')
          echo "::error::e2e tail: $MSG"
          exit 0

      - name: Upload scenario test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moon-test-e2e-log
          path: ${{ runner.temp }}/moon_test_e2e.log
          retention-days: 1

  # ── Final gate: verify the published metrics match the code.
  #    Runs after tests so the test count is read from the actual log.
  repo-stats:
    name: Repo stats
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [checks, build-and-test, e2e-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Download test log
        uses: actions/download-artifact@v8
        with:
          name: moon-test-log
          path: ${{ runner.temp }}

      - name: Download scenario test log
        uses: actions/download-artifact@v8
        with:
          name: moon-test-e2e-log
          path: ${{ runner.temp }}

      - name: Repo stats gate (T1)
        run: |
          # Recorded caliber = the whole module suite minus lib/mcp, which is now
          # produced by two jobs, so the gate sums both per-invocation logs.
          # lib/mcp stays out of the count (its own step, own log).
          MAIN="$RUNNER_TEMP/moon_test_main.log"
          E2E="$RUNNER_TEMP/moon_test_e2e.log"
          for f in "$MAIN" "$E2E"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing $f — a test job did not publish its own log, so the count would be wrong"
              exit 1
            fi
          done
          cat "$MAIN" "$E2E" > "$RUNNER_TEMP/moon_test_counted.log"
          bash scripts/repo_stats.sh check \
            --test-count-from "$RUNNER_TEMP/moon_test_counted.log"
