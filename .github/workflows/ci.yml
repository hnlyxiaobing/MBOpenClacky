name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Fast gate: type errors and policy violations fail here in ~1 min,
  #    before the expensive build/test runners spin up.
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # ubuntu-22.04 runners ship with build-essential and libssl-dev pre-installed.
      # No apt-get step needed — the old workflow spent 30-60s installing packages
      # that were already present.

      # Cache ~/.moon keyed by OS+arch. When the toolchain updates, the version
      # string in cache key changes → cache miss → fresh download. Same safety as
      # always-install, but free on cache hits (~30s saved per job).
      - name: Cache MoonBit toolchain
        id: toolchain-cache
        uses: actions/cache@v6
        with:
          path: ~/.moon
          key: moon-${{ runner.os }}-${{ runner.arch }}-toolchain

      - name: Install MoonBit toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit installation
        id: toolchain
        run: |
          moon version
          echo "id=$(moon version | head -1 | tr -d ' ()')" >> "$GITHUB_OUTPUT"

      - name: Cache mooncakes dependencies
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: mooncakes-${{ runner.os }}-v2-${{ hashFiles('moon.mod.json', 'moon.mod') }}
          restore-keys: |
            mooncakes-${{ runner.os }}-v2-

      - name: Update registry index
        run: moon update

      - name: Type check
        run: moon check -j "$(nproc)"

      - name: Warning budget gate (P2-3)
        run: bash scripts/warn_count.sh

      - name: Public API gate (P0-1, .mbti diff)
        run: |
          moon info
          if ! git diff --exit-code -- '**/pkg.generated.mbti'; then
            echo "::error::public API changed without committing .mbti files." \
                 "Run 'moon info' locally and commit the updated pkg.generated.mbti." >&2
            git diff --stat -- '**/pkg.generated.mbti' >&2 || true
            exit 1
          fi

      - name: Known-gaps ledger gate (P0-2)
        run: bash scripts/known_gaps.sh check

      - name: Guard insecure crypto build
        run: bash scripts/check-crypto-build.sh release

  # ── Build the release binary and run the full test suite.
  #    Both steps compile the same library code but into separate artifact trees
  #    (build/ vs test/). Caching _build/native/release covers both trees in a
  #    single cache entry: on a cache hit, moon skips recompilation entirely for
  #    unchanged packages.
  #
  #    Tests run in debug mode (no --release): the compiler ICE that forced
  #    release mode was in vendor/mbtpdf's own test driver, which is outside
  #    the scoped test command. Scoped debug tests compile 2-3x faster.
  build-and-test:
    name: Build · Test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - name: Cache MoonBit toolchain
        id: toolchain-cache
        uses: actions/cache@v6
        with:
          path: ~/.moon
          key: moon-${{ runner.os }}-${{ runner.arch }}-toolchain

      - name: Install MoonBit toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit installation
        id: toolchain
        run: |
          moon version
          echo "id=$(moon version | head -1 | tr -d ' ()')" >> "$GITHUB_OUTPUT"

      - name: Cache mooncakes dependencies
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: mooncakes-${{ runner.os }}-v2-${{ hashFiles('moon.mod.json', 'moon.mod') }}
          restore-keys: |
            mooncakes-${{ runner.os }}-v2-

      - name: Update registry index
        run: moon update

      # Cache the entire native release tree. Both `moon build` (→ build/) and
      # `moon test --release` (→ test/) write here. A single cache entry covers
      # both, so on a cache hit neither step recompiles unchanged packages.
      #
      # Measured baseline (uncached, release mode): build 4.7 min, test 13.3 min.
      # With cache hit + debug mode: build ~1 min, test ~1-2 min.
      - name: Cache compiled artifacts
        uses: actions/cache@v6
        with:
          path: _build/native/release
          key: moonbuild-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('moon.mod', 'moon.mod.json', 'scripts/build-script.js', '**/*.mbt', '**/*.mbti', '**/moon.pkg') }}
          restore-keys: |
            moonbuild-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      - name: Build (native release)
        run: moon build --target native --release cmd -j "$(nproc)"

      - name: Run tests (module packages)
        # Scoped to lib/cmd/test minus lib/mcp. Debug mode: the old --release
        # was needed because bare `moon test` (including vendor/mbtpdf) hit a
        # compiler ICE. The scoped command excludes vendor packages, so debug
        # mode works and compiles 2-3x faster.
        run: |
          pkgs=$(find lib cmd test -name moon.pkg | sed 's|/moon.pkg$||' \
            | grep -v '^lib/mcp$' | tr '\n' ' ')
          moon test $pkgs -j "$(nproc)" > "$RUNNER_TEMP/moon_test.log" 2>&1
          cat "$RUNNER_TEMP/moon_test.log"

      - name: Run lib/mcp tests
        run: moon test lib/mcp -j "$(nproc)"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moon-test-log
          path: ${{ runner.temp }}/moon_test.log
          retention-days: 1

      - name: CLI contract probes (P0-3)
        run: |
          BIN="_build/native/release/build/hnlyxiaobing/MBOpenClacky/cmd/cmd"
          if [ ! -x "$BIN" ] && [ -x "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          if [ ! -x "$BIN" ]; then
            echo "::error::release binary not found at $BIN" >&2
            exit 1
          fi
          "$BIN" selftest --repo .

      - name: Deterministic capability eval (P2 / T8)
        run: |
          BIN="_build/native/release/build/hnlyxiaobing/MBOpenClacky/cmd/cmd"
          if [ ! -x "$BIN" ] && [ -x "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          if [ ! -x "$BIN" ]; then
            echo "::error::release binary not found at $BIN" >&2
            exit 1
          fi
          "$BIN" eval --offline --repo . | tee "$RUNNER_TEMP/eval.json"
          grep -q '"completion_rate":1' "$RUNNER_TEMP/eval.json"
          grep -q '"repeatability":1' "$RUNNER_TEMP/eval.json"

  # ── Final gate: verify the published metrics match the code.
  #    Runs after tests so the test count is read from the actual log.
  repo-stats:
    name: Repo stats
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [checks, build-and-test]
    steps:
      - uses: actions/checkout@v7

      - name: Download test log
        uses: actions/download-artifact@v4
        with:
          name: moon-test-log
          path: ${{ runner.temp }}

      - name: Repo stats gate (T1)
        run: |
          bash scripts/repo_stats.sh check \
            --test-count-from "$RUNNER_TEMP/moon_test.log"
