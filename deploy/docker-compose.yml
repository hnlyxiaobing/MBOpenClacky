# ============================================================
# MBOpenClacky — Docker Compose deployment
# Self-hosted AI Agent Web Server (port 7071).
#
# Quick start (both keys are required for the container to stay up):
#   MBOPENCLACKY_WEB_API_KEY=$(openssl rand -hex 32) MBOPENCLACKY_API_KEY=sk-... \
#     docker compose up -d --build
#   curl http://localhost:7071/health
#
# Override the port / timezone via environment:
#   MBOPENCLACKY_WEB_PORT=8080 TZ=Asia/Shanghai docker compose up -d
# ============================================================

services:
  mbopenclacky:
    build:
      context: .
      dockerfile: Dockerfile
    image: mbopenclacky:latest
    container_name: mbopenclacky
    restart: unless-stopped
    # Expose the Web UI port. The container always listens on 7071
    # (see Dockerfile); we only remap the host side here.
    ports:
      - "${MBOPENCLACKY_WEB_PORT:-7071}:7071"
    environment:
      # HOME drives where ~/.mbopenclacky (config/sessions/skills/logs)
      # is created. We pin it to /app so the named volume below captures
      # all persistent data in one place.
      HOME: "/app"
      MBOPENCLACKY_WEB_PORT: "7071"
      # Bind to all interfaces inside the container (required for port mapping).
      # The security gate refuses to start without an API key on non-loopback hosts.
      MBOPENCLACKY_WEB_HOST: "0.0.0.0"
      # REQUIRED: API key for web authentication. The server will refuse to
      # start without this when MBOPENCLACKY_WEB_HOST is 0.0.0.0.
      # Generate one with: openssl rand -hex 32
      MBOPENCLACKY_WEB_API_KEY: "${MBOPENCLACKY_WEB_API_KEY:?MBOPENCLACKY_WEB_API_KEY is required}"
      # The web server ALSO needs at least one LLM model. Supply it either as
      # MBOPENCLACKY_API_KEY (null-value form below = pass through from the host
      # only when actually set; it never injects an empty string) or by writing
      # ~/.mbopenclacky/config.toml into the volume, since HOME is pinned to /app.
      # Without either, `server` exits 1 with "No API key configured" — verified by
      # running the built image; an empty MBOPENCLACKY_API_KEY is rejected too.
      # Leaving this out makes `restart: unless-stopped` a restart loop that the
      # healthcheck below can never leave.
      MBOPENCLACKY_API_KEY:
      TZ: "${TZ:-UTC}"
    volumes:
      # Single named volume holds config, sessions, skills, logs and
      # any local memory/state created under /app.
      - mbopenclacky-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7071/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mbopenclacky-data:
    driver: local
